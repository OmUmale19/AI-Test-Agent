<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Glass Metallic Gradients -->
    <linearGradient id="folder-back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35" />
      <stop offset="100%" stop-color="#121418" />
    </linearGradient>

    <linearGradient id="folder-front-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22262c" />
      <stop offset="100%" stop-color="#0e1013" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252930" />
      <stop offset="100%" stop-color="#101215" />
    </linearGradient>

    <linearGradient id="stroke-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="icon-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#subtle-glow)">
    <!-- BACK FOLDER TAB & BODY -->
    <path 
      d="M 130 90 
         C 130 80, 138 72, 148 72 
         L 205 72 
         C 215 72, 222 78, 228 86 
         L 242 104 
         C 246 110, 252 114, 260 114 
         L 315 114 
         C 326 114, 335 123, 335 134 
         L 335 250 
         C 335 258, 328 265, 320 265 
         L 135 265 
         C 127 265, 120 258, 120 250 
         L 120 100 
         C 120 90, 127 90, 130 90 Z" 
      fill="url(#folder-back-grad)" 
      stroke="url(#stroke-highlight)" 
      stroke-width="2.5" 
      stroke-linejoin="round"
    />

    <!-- FRONT FOLDER FLAP -->
    <path 
      d="M 148 140 
         L 355 140 
         C 366 140, 374 148, 373 159 
         L 358 295 
         C 357 305, 348 312, 337 312 
         L 135 312 
         C 124 312, 116 303, 117 292 
         L 133 156 
         C 134 147, 140 140, 148 140 Z" 
      fill="url(#folder-front-grad)" 
      stroke="url(#stroke-highlight)" 
      stroke-width="2.5" 
      stroke-linejoin="round"
    />

    <!-- CODE EMBLEM (</>) ON FRONT FLAP -->
    <g stroke="url(#icon-highlight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Angle Bracket < -->
      <path d="M 215 210 L 195 226 L 215 242" />
      <!-- Forward Slash / -->
      <path d="M 238 202 L 222 250" />
      <!-- Right Angle Bracket > -->
      <path d="M 245 210 L 265 226 L 245 242" />
    </g>

    <!-- CIRCULAR LINK BADGE (BOTTOM RIGHT) -->
    <g transform="translate(365, 260)">
      <!-- Outer Badge Circle Base -->
      <circle cx="0" cy="0" r="62" fill="url(#badge-grad)" stroke="url(#stroke-highlight)" stroke-width="2.5" />
      
      <!-- Inner Dashed Ring -->
      <circle cx="0" cy="0" r="53" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 5" opacity="0.75" />

      <!-- Centered Link Chain Icon 🔗 -->
      <g transform="rotate(-45)" stroke="url(#icon-highlight)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Top Link Ring -->
        <rect x="-18" y="-12" width="22" height="14" rx="7" />
        <!-- Bottom Link Ring -->
        <rect x="-4" y="-2" width="22" height="14" rx="7" />
      </g>
    </g>
  </g>
</svg>
